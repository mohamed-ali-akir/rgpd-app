# Exemple de configuration Nginx pour la production.
# Front (build React) et API (Laravel) sont servis sur le MÊME domaine :
# indispensable pour que le cookie de session Sanctum soit envoyé par le navigateur.
#
# À adapter : server_name, chemins, version de PHP-FPM, certificats (Let's Encrypt / certbot).

server {
    listen 443 ssl;
    http2 on;
    server_name efface-moi.example;

    ssl_certificate     /etc/letsencrypt/live/efface-moi.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efface-moi.example/privkey.pem;

    # Build du front : "npm run build" dans frontend/ produit frontend/dist
    root /var/www/rgpd-app/frontend/dist;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /api et /sanctum → Laravel (PHP-FPM). Le point d'entrée est backend/public/index.php.
    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/rgpd-app/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/rgpd-app/backend/public;
        # Laravel génère ses liens (vérification d'e-mail, OAuth) à partir de l'hôte reçu.
        fastcgi_param HTTP_HOST $host;
    }

    # Fichiers statiques du build (noms avec empreinte → cache long).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Toutes les autres URL (/requests/12, /settings…) sont des routes React :
    # on renvoie index.html et React Router affiche la bonne page.
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name efface-moi.example;
    return 301 https://$host$request_uri;
}
